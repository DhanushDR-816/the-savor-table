{% extends "base.html" %}

{% block title %}Join Table | The Savor Table{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <div style="margin-bottom: 1.5rem; text-align: center; display: flex; justify-content: center;">
                    <img src="{{ url_for('static', filename='images/savor-table-logo.png') }}" alt="The Savor Table - Recipes worth remembering" class="auth-logo-img">
                </div>
                <span class="section-tag">BECOME A MEMBER</span>
                <h2>Join The Savor Table</h2>
                <p>Create your account to save recipes, organize your pantry, and share creations.</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}" class="auth-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="name" name="name" value="{{ name if name else '' }}" placeholder="e.g. Eleanor Vance" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" value="{{ email if email else '' }}" placeholder="e.g. chef@savortable.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-terracotta" style="width: 100%; padding: 0.9rem; margin-top: 0.5rem;">
                    <span>Create Account</span> <span>→</span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted);">
                <p>Already have an account? <a href="{{ url_for('login') }}" style="color: var(--terracotta); font-weight: 700;">Sign In</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% extends "base.html" %}

{% block title %}Sign In | The Savor Table{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <div style="margin-bottom: 1.5rem; text-align: center; display: flex; justify-content: center;">
                    <img src="{{ url_for('static', filename='images/savor-table-logo.png') }}" alt="The Savor Table - Recipes worth remembering" class="auth-logo-img">
                </div>
                <span class="section-tag">MEMBER ACCESS</span>
                <h2>Welcome Back</h2>
                <p>Sign in to access your culinary table, collections, and saved recipes.</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" value="{{ email if email else '' }}" placeholder="e.g. chef@savortable.com" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-terracotta" style="width: 100%; padding: 0.9rem; margin-top: 0.5rem;">
                    <span>Sign In to The Savor Table</span> <span>→</span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted);">
                <p>New to The Savor Table? <a href="{{ url_for('register') }}" style="color: var(--terracotta); font-weight: 700;">Create Account</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
